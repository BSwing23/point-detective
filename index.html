<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Point Detective</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root{
    --navy-950:#0a1526;
    --navy-900:#0f1e38;
    --navy-800:#152a4a;
    --navy-700:#1c3760;
    --navy-600:#274a7d;
    --cardinal-600:#8a1731;
    --cardinal-500:#a8203f;
    --cardinal-400:#c8324f;
    --gold:#c9a24b;
    --white:#f5f3ee;
    --grey-300:#9fb0c7;
    --grey-500:#5f7292;
    --green:#3f8f5f;
    --green-bg:#173324;
    --amber:#c9a24b;
    --amber-bg:#332913;
    --orange:#c1682f;
    --orange-bg:#331f11;
    --red:#c8324f;
    --red-bg:#331419;
    --radius:14px;
    --radius-lg:20px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-950);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #root{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Header ---------- */
  .topbar{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px 18px 12px;
    border-bottom:1px solid var(--navy-700);
    background:linear-gradient(180deg, var(--navy-900), var(--navy-950));
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .brand img{height:110px;width:auto;display:block;}
  .brand-text{font-weight:800;font-size:14px;letter-spacing:0.02em;line-height:1.1;text-align:center;}
  .brand-text small{display:block;font-weight:500;font-size:10px;color:var(--gold);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
  .icon-btn{
    background:var(--navy-800);border:1px solid var(--navy-600);color:var(--grey-300);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;
    position:absolute;top:14px;right:18px;
  }
  .icon-btn:active{background:var(--navy-700);}

  /* ---------- Generic layout ---------- */
  .screen{padding:20px 18px 40px;display:flex;flex-direction:column;gap:18px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--grey-300);font-weight:700;margin-bottom:8px;}
  input[type=text], input[type=number], input[type=password], input[type=email]{
    width:100%;padding:14px 16px;border-radius:var(--radius);
    border:1.5px solid var(--navy-600);background:var(--navy-800);color:var(--white);
    font-size:17px;font-weight:600;
  }
  input::placeholder{color:var(--grey-500);}
  input:focus{outline:none;border-color:var(--gold);}

  .btn{
    border:none;border-radius:var(--radius);padding:18px;font-size:17px;font-weight:800;
    cursor:pointer;letter-spacing:0.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{background:var(--cardinal-500);color:var(--white);}
  .btn-primary:active{background:var(--cardinal-600);}
  .btn-secondary{background:var(--navy-800);color:var(--white);border:1.5px solid var(--navy-600);}
  .btn-secondary:active{background:var(--navy-700);}
  .btn-ghost{background:transparent;color:var(--grey-300);border:1.5px solid var(--navy-700);}
  .btn:disabled{opacity:0.35;pointer-events:none;}

  .setup-hero{text-align:center;padding:10px 0 6px;}
  .setup-hero img{width:150px;height:auto;margin-bottom:6px;}
  .setup-hero h1{font-size:18px;margin:4px 0 0;font-weight:800;}
  .setup-hero p{color:var(--grey-300);font-size:13px;margin:4px 0 0;}
  .setup-tools{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:6px;}
  .setup-tools .tools-sep{color:var(--grey-500);font-weight:700;}
  .setup-tools-note{text-align:center;font-size:11px;color:var(--grey-500);line-height:1.5;padding:2px 10px 0;}

  .segmented{display:flex;background:var(--navy-800);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--navy-700);}
  .segmented button{
    flex:1;padding:10px;border:none;border-radius:9px;background:transparent;color:var(--grey-300);
    font-weight:700;font-size:13px;cursor:pointer;
  }
  .segmented button.active{background:var(--navy-600);color:var(--white);}

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid var(--navy-700);border-radius:var(--radius-lg);
    padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .score-team{flex:1;text-align:center;}
  .score-team .name{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--grey-300);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .score-team .score{font-size:44px;font-weight:900;line-height:1.1;margin-top:2px;}
  .score-team.us .score{color:var(--gold);}
  .score-team.opp .score{color:var(--white);}
  .score-mid{font-size:12px;color:var(--grey-500);font-weight:800;padding:0 4px;}
  .set-pill{
    align-self:center;background:var(--navy-700);color:var(--grey-300);font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:999px;letter-spacing:0.06em;
  }

  .serving-indicator{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:13px;color:var(--grey-300);font-weight:700;
  }
  .serving-indicator .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}

  /* ---------- Step card ---------- */
  .step-card{
    background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);
    padding:20px 16px;display:flex;flex-direction:column;gap:14px;flex-shrink:0;
  }
  .step-title{font-size:15px;font-weight:800;text-align:center;color:var(--white);}
  .step-sub{font-size:12px;color:var(--grey-300);text-align:center;margin-top:-8px;}
  .fbk-hint{font-size:11px;color:var(--grey-500);line-height:1.4;margin:-4px 0 2px;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choice-grid.stack{grid-template-columns:1fr;}
  .choice-btn{
    padding:22px 10px;border-radius:var(--radius);border:1.5px solid var(--navy-600);
    background:var(--navy-800);color:var(--white);font-weight:800;font-size:16px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .choice-btn .sub{font-size:11px;font-weight:600;color:var(--grey-300);}
  .choice-btn:active{transform:scale(0.98);}
  .choice-btn.ace{border-color:var(--green);}
  .choice-btn.ace:active{background:var(--green-bg);}
  .choice-btn.error{border-color:var(--red);}
  .choice-btn.error:active{background:var(--red-bg);}
  .choice-btn.in{border-color:var(--gold);}
  .choice-btn.in:active{background:var(--amber-bg);}
  .choice-btn.team-us{border-color:var(--cardinal-500);}
  .choice-btn.team-opp{border-color:var(--navy-600);}
  .choice-btn.yes{border-color:var(--green);}
  .choice-btn.no{border-color:var(--red);}

  .undo-row{display:flex;justify-content:center;padding-top:4px;}
  .undo-link{color:var(--grey-500);font-size:12px;font-weight:700;background:none;border:none;cursor:pointer;text-decoration:underline;}

  /* ---------- Reports ---------- */
  .scope-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .scope-tabs button{
    white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--navy-600);
    background:var(--navy-800);color:var(--grey-300);font-size:12px;font-weight:700;cursor:pointer;
  }
  .scope-tabs button.active{background:var(--cardinal-500);color:var(--white);border-color:var(--cardinal-500);}

  .stat-card{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);overflow:hidden;}
  .stat-card-header{background:var(--navy-800);padding:12px 16px;font-weight:800;font-size:13px;letter-spacing:0.03em;
    display:flex;align-items:center;justify-content:space-between;}
  .stat-card-header .badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .net-row{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--navy-800);}
  .net-value{font-size:30px;font-weight:900;}
  .net-value.pos{color:var(--green);}
  .net-value.neg{color:var(--red);}
  .net-value.zero{color:var(--grey-300);}
  .net-detail{font-size:11px;color:var(--grey-300);line-height:1.5;}
  .row-table{padding:0 16px;}
  .row-table .tr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--navy-800);font-size:13px;}
  .row-table .tr:last-child{border-bottom:none;}
  .row-table .tr .label{color:var(--grey-300);}
  .row-table .tr .val{font-weight:800;}
  .row-table .tr .val small{font-weight:500;color:var(--grey-500);margin-left:4px;}
  .pad-bottom{height:16px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--grey-300);
  }
  .empty-state .glyph{font-size:34px;margin-bottom:10px;}
  .empty-state h3{color:var(--white);font-size:15px;margin:0 0 6px;}
  .empty-state p{font-size:13px;margin:0;line-height:1.5;}

  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;font-size:10px;color:var(--grey-300);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:8px;height:8px;border-radius:50%;}

  .bottom-actions{display:flex;gap:10px;padding-top:4px;}
  .bottom-actions .btn{flex:1;}
  .actions-hint{text-align:center;font-size:11px;color:var(--grey-500);line-height:1.4;padding-top:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy-800);border:1px solid var(--navy-600);color:var(--white);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:50;
  }

  /* ---------- Recent rallies ---------- */
  .rally-log{display:flex;flex-direction:column;gap:8px;}
  .rally-log-title{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--grey-500);font-weight:700;padding:2px 2px 0;}
  .rally-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy-900);border:1px solid var(--navy-800);border-radius:10px;
    padding:10px 12px;font-size:12px;
  }
  .rally-item .who{color:var(--grey-300);font-weight:600;}
  .rally-item .what{font-weight:800;}
  .rally-item .what.ace{color:var(--green);}
  .rally-item .what.error{color:var(--red);}
  .rally-item .what.fbk{color:var(--gold);}
  .rally-item .score-after{color:var(--grey-500);font-weight:700;font-variant-numeric:tabular-nums;}

  /* ---------- Triangle Report (light card, matches Serve Triangle Logger style) ---------- */
  .tri-card{
    background:#ffffff;border-radius:var(--radius-lg);overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,0.35);
  }
  .tri-header{background:var(--navy-950);padding:18px 20px;}
  .tri-header h2{margin:0;color:#fff;font-size:17px;font-weight:800;letter-spacing:0.01em;}
  .tri-header p{margin:4px 0 0;color:var(--grey-300);font-size:12px;}
  .tri-colheader{
    display:flex;padding:10px 20px;font-size:11px;font-weight:800;letter-spacing:0.06em;
    color:#8a94a6;background:#f4f6f9;border-bottom:1px solid #e7ebf1;
  }
  .tri-colheader .m{flex:1.3;}
  .tri-colheader .c{flex:1;text-align:left;}
  .tri-colheader .c.us{color:#1c3e8a;}
  .tri-colheader .c.opp{color:#a8203f;}
  .tri-section{
    background:#eef1f6;color:#42506b;font-size:11px;font-weight:800;letter-spacing:0.05em;
    padding:9px 20px;border-bottom:1px solid #e2e7ee;border-top:1px solid #e2e7ee;
  }
  .tri-net-row{display:flex;padding:16px 20px;border-bottom:1px solid #eef1f5;gap:12px;}
  .tri-net-label{flex:1.3;font-size:10px;font-weight:800;letter-spacing:0.05em;color:#8a94a6;padding-top:4px;}
  .tri-net-value{font-size:30px;font-weight:900;line-height:1;}
  .tri-net-value.pos{color:#2e8b57;}
  .tri-net-value.neg{color:#c0392b;}
  .tri-net-value.zero{color:#8a94a6;}
  .tri-net-detail{flex:2;display:flex;flex-direction:column;gap:6px;justify-content:center;}
  .tri-net-detail .line{font-size:14px;color:#1a2333;}
  .tri-net-detail .line b{font-weight:800;font-size:15px;margin-right:5px;}
  .tri-net-detail .line b.us{color:#1c3e8a;}
  .tri-net-detail .line b.opp{color:#a8203f;}
  .tri-net-detail .line .d{color:#8a94a6;font-size:12px;}
  .tri-plain-row{display:flex;padding:12px 20px;border-bottom:1px solid #eef1f5;font-size:14px;color:#42506b;}
  .tri-plain-row .m{flex:1.3;}
  .tri-plain-row .c{flex:1;font-weight:800;color:#1a2333;text-align:left;}
  .tri-plain-row .c small{display:block;font-weight:600;color:#8a94a6;font-size:10px;margin-top:2px;}
  .tri-plain-row .c.zone-green{color:#2e8b57;}
  .tri-plain-row .c.zone-gold{color:#a08420;}
  .tri-plain-row .c.zone-orange{color:#c1682f;}
  .tri-plain-row .c.zone-red{color:#c0392b;}
  .tri-legend{display:flex;flex-wrap:wrap;gap:12px 16px;padding:6px 20px 18px;}
  .tri-legend-header{
    font-size:10px;font-weight:800;letter-spacing:0.08em;color:#8a94a6;
    padding:16px 20px 6px;border-top:1px solid #e2e7ee;margin-top:4px;
  }
  .tri-legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:#5a6478;font-weight:600;}
  .tri-legend .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tri-legend .sw.green{background:#2e8b57;}
  .tri-legend .sw.gold{background:#c9a24b;}
  .tri-legend .sw.orange{background:#c1682f;}
  .tri-legend .sw.red{background:#c0392b;}
  .tri-scope-note{text-align:center;font-size:11px;color:var(--grey-500);font-weight:600;padding-top:2px;}
  .tri-note{
    font-size:11px;line-height:1.5;color:#5a6478;font-style:italic;
    padding:12px 20px 16px;border-top:1px solid #eef1f5;background:#f9fafc;
  }
  .tri-note b{color:#42506b;font-weight:800;font-style:normal;}

  /* ---------- Rally editing ---------- */
  .choice-btn.selected{background:var(--navy-600);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .rally-item{cursor:pointer;}
  .rally-item:active{background:var(--navy-800);}
  .edit-banner{
    background:var(--amber-bg);border:1px solid var(--gold);color:var(--gold);
    font-size:12px;font-weight:800;text-align:center;padding:8px;border-radius:10px;
  }

  /* ---------- Set picker (Season history) ---------- */
  .set-picker{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);padding:14px 16px;}
  .set-picker-title{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--grey-300);font-weight:700;margin-bottom:10px;}
  .set-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .set-pill{
    padding:8px 12px;border-radius:999px;border:1.5px solid var(--navy-600);background:var(--navy-800);
    color:var(--grey-500);font-size:11px;font-weight:700;cursor:pointer;line-height:1.2;
  }
  .set-pill.active{background:var(--cardinal-500);border-color:var(--cardinal-500);color:var(--white);}
  .set-pill.all-pill{background:var(--navy-600);border-color:var(--navy-600);color:var(--white);}
  .set-pill.all-pill.active{background:var(--gold);border-color:var(--gold);color:var(--navy-950);}

  /* ---------- Auth / Paywall / Account ---------- */
  .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:90px 20px;min-height:60vh;}
  .splash img{width:140px;height:auto;opacity:0.92;}
  .splash .spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--navy-700);border-top-color:var(--gold);animation:pdspin 0.8s linear infinite;}
  .splash p{color:var(--grey-300);font-size:13px;margin:0;}
  @keyframes pdspin{to{transform:rotate(360deg);}}

  .auth-tabs{display:flex;background:var(--navy-800);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--navy-700);}
  .auth-tabs button{flex:1;padding:11px;border:none;border-radius:9px;background:transparent;color:var(--grey-300);font-weight:700;font-size:13px;cursor:pointer;}
  .auth-tabs button.active{background:var(--navy-600);color:var(--white);}
  .auth-error{background:var(--red-bg);border:1px solid var(--red);color:var(--red);font-size:12px;font-weight:700;text-align:center;padding:10px;border-radius:10px;}
  .btn-google{background:var(--white);color:#1f1f1f;border:1.5px solid var(--navy-600);}
  .btn-google:active{background:#e8e6e0;}
  .btn-google .gicon{display:flex;align-items:center;}
  .or-divider{position:relative;text-align:center;margin:2px 0;}
  .or-divider:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--navy-700);}
  .or-divider span{position:relative;background:var(--navy-950);padding:0 12px;color:var(--grey-500);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;}
  .auth-note{color:var(--grey-300);font-size:12px;text-align:center;line-height:1.5;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px;}

  .paywall{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);padding:22px 18px;display:flex;flex-direction:column;gap:14px;text-align:center;}
  .paywall h2{margin:0;font-size:19px;font-weight:800;}
  .paywall .price{font-size:13px;color:var(--grey-300);}
  .paywall ul{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .paywall li{font-size:13px;color:var(--white);padding-left:22px;position:relative;line-height:1.4;}
  .paywall li:before{content:"\2713";position:absolute;left:0;color:var(--gold);font-weight:900;}
  .paywall .confirm-box{background:var(--amber-bg);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:12px;border-radius:10px;line-height:1.5;}

  .acct-card{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px;}
  .acct-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid var(--navy-800);padding-bottom:10px;}
  .acct-row:last-of-type{border-bottom:none;}
  .acct-row .k{color:var(--grey-300);}
  .acct-row .v{font-weight:800;text-align:right;}
  .icon-btn.acct{left:18px;right:auto;}
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase (compat build — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- Lemon Squeezy overlay checkout -->
<script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>

<!-- html2canvas — Save Snapshot export in the Triangle Report -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

<script>
/* =========================================================
   POINT DETECTIVE — v1
   Match logging: standalone logic, data in localStorage.
   Accounts + subscription gate: Firebase Auth + Firestore,
   status kept in sync by the Lemon Squeezy webhook
   (netlify/functions/lemonsqueezy-webhook.js).
   ========================================================= */

/* ---------- Config ----------
   The Firebase apiKey below is a PUBLIC project identifier, not a secret — it is
   meant to ship in client code. Access is controlled by Firestore security rules
   and the Firebase authorized-domains list, not by hiding this value. */
const firebaseConfig = {

function dataSnapshot(){

    oppName: state.oppName || "",

    current: state.current || null
  };

// Fold a cloud copy into local state without losing anything logged offline here.
function mergeRemote(remote){
  if(!remote) return false;
  let changed = false;
  if(!Array.isArray(state.matches)) state.matches = [];
  const have = new Set(state.matches.map(m => m && m.id));
  (remote.matches || []).forEach(m => {
    if(m && m.id != null && !have.has(m.id)){ state.matches.push(m); have.add(m.id); changed = true; }
  });
  if(changed){
    state.matches.sort((a,b)=> String(a && a.createdAt || "").localeCompare(String(b && b.createdAt || "")));
  }
  if(!state.current && remote.current){ state.current = remote.current; changed = true; }
  if(!state.teamName && remote.teamName){ state.teamName = remote.teamName; changed = true; }
  if(!state.oppName && remote.oppName){ state.oppName = remote.oppName; changed = true; }
  return changed;
}

/* -------- Recompute a set's server chain + score after an edit/delete -------- */
function recomputeChain(s){
  for(let i=1;i<s.rallies.length;i++){
    s.rallies[i].server = s.rallies[i-1].rallyWinner;
  }
  let us=0, opp=0;
  s.rallies.forEach(r=>{ if(r.rallyWinner==="us") us++; else opp++; });
  s.scoreUs = us; s.scoreOpp = opp;
  s.serving = s.rallies.length ? s.rallies[s.rallies.length-1].rallyWinner : s.serving;
  s.pendingServeResult = null;
  s.pendingFbk = null;
}
function startEdit(i){
  const r = state.current.activeSet.rallies[i];
  editingIndex = i;
  editDraft = { server: r.server, serveResult: r.serveResult, fbk: r.fbk, rallyWinner: r.rallyWinner };
  render();
}
function cancelEdit(){ editingIndex=null; editDraft=null; render(); }
function saveEdit(){
  const s = state.current.activeSet;
  const i = editingIndex;
  const d = editDraft;
  let finalized;
  if(d.serveResult === "ace"){
    finalized = { server: d.server, serveResult:"ace", fbk:null, rallyWinner: d.server };
  } else if(d.serveResult === "error"){
    const receiver = d.server === "us" ? "opp" : "us";
    finalized = { server: d.server, serveResult:"error", fbk:null, rallyWinner: receiver };
  } else {
    const receiver = d.server === "us" ? "opp" : "us";
    if(d.fbk === true){
      finalized = { server:d.server, serveResult:"in", fbk:true, rallyWinner: receiver };
    } else {
      finalized = { server:d.server, serveResult:"in", fbk:false, rallyWinner: d.rallyWinner };
    }
  }
  s.rallies[i] = finalized;
  recomputeChain(s);
  editingIndex = null; editDraft = null;
  saveState(); render();
}
function deleteRally(i){
  const s = state.current.activeSet;
  s.rallies.splice(i,1);
  recomputeChain(s);
  editingIndex = null; editDraft = null;
  saveState(); render();
}

/* -------- Match / Set helpers -------- */
function newMatch(teamName, oppName){
  return {
    id: Date.now(),
    teamName, oppName,
    createdAt: new Date().toISOString(),
    sets: [],              // archived completed sets
    activeSet: newSet(1, null)
  };
}
function newSet(setNumber, firstServer){
  return {
    setNumber,
    scoreUs: 0,
    scoreOpp: 0,
    serving: firstServer,      // 'us' | 'opp'
    rallies: [],                // {server, serveResult, fbk, rallyWinner}
    pendingServeResult: null,
    pendingFbk: null
  };
}

/* -------- Rally logging logic -------- */
function logServeResult(result){
  const s = state.current.activeSet;
  if(result === "ace"){
    finalizeRally(s.serving, s.serving, "ace", null);
  } else if(result === "error"){
    const receiver = s.serving === "us" ? "opp" : "us";
    finalizeRally(s.serving, receiver, "error", null);
  } else if(result === "in"){
    s.pendingServeResult = "in";
    render();
  }
}
function logFbk(isYes){
  const s = state.current.activeSet;
  const receiver = s.serving === "us" ? "opp" : "us";
  if(isYes){
    finalizeRally(s.serving, receiver, "in", true);
  } else {
    s.pendingFbk = false;
    render();
  }
}
function logRallyWinner(winner){
  const s = state.current.activeSet;
  finalizeRally(s.serving, winner, "in", false);
}
function finalizeRally(server, rallyWinner, serveResult, fbk){
  const s = state.current.activeSet;
  s.rallies.push({ server, serveResult, fbk, rallyWinner });
  if(rallyWinner === "us") s.scoreUs++; else s.scoreOpp++;
  s.serving = rallyWinner;
  s.pendingServeResult = null;
  s.pendingFbk = null;
  saveState();
  render();
}
function undoLastAction(){
  const s = state.current.activeSet;

  // 1. Mid-rally: step back one prompt at a time.
  if(s.pendingFbk === false){          // on "Who won the rally?" -> back to the FBK question
    s.pendingFbk = null;
    saveState(); render(); return;
  }
  if(s.pendingServeResult){            // on the FBK question -> back to "Serve?"
    s.pendingServeResult = null;
    s.pendingFbk = null;
    saveState(); render(); return;
  }

  // 2. No rally in progress: roll back the last finalized rally to the step
  //    where a mistake is most likely, keeping the parts already entered.
  if(s.rallies.length > 0){
    const last = s.rallies.pop();
    recomputeChain(s);          // reruns score + server chain, clears pending
    s.serving = last.server;    // we're redoing this rally, so the serve returns to its server

    if(last.serveResult === "in"){
      // Preserve "In Play"; drop back to the FBK answer (fbk was Yes) or the
      // rally-winner tap (fbk was No) — no need to re-enter the serve result.
      s.pendingServeResult = "in";
      s.pendingFbk = (last.fbk === false) ? false : null;
    }
    // Ace / Error finalize with no intermediate step — fully removed, back to "Serve?".

    saveState(); render(); return;
  }

  // 3. Nothing logged yet, but a first server was picked: undo that.
  if(s.serving){
    s.serving = null;
    saveState(); render();
  }
}

function endMatch(){
  const c = state.current;
  const finalSets = c.sets.slice();
  if(c.activeSet.rallies.length > 0) finalSets.push(c.activeSet);

  if(finalSets.length === 0){
    if(!confirm("This match has no rallies logged. Discard it?")) return;
    state.current = null;
    state.screen = "setup";
    saveState();
    render();
    return;
  }

  const scoreStr = finalSets.map(s => s.scoreUs + "–" + s.scoreOpp).join(", ");
  const msg = "Finish and save this match?\n\n" + c.teamName + " vs " + c.oppName +
    "\n" + finalSets.length + (finalSets.length === 1 ? " set" : " sets") + "  (" + scoreStr + ")";
  if(!confirm(msg)) return;

  c.sets = finalSets;
  c.finishedAt = new Date().toISOString();
  state.matches.push(c);
  state.current = null;
  state.screen = "setup";
  saveState();
  render();
  toast("Match saved ✓  It's in your Season report.");
}

function allSetsInScope(scope){
  // scope: {type:'set'} current set only
  //        {type:'match'} current match (all archived sets + active)
  //        {type:'season'} all matches ever (archived + current match if active)
  let sets = [];
  if(scope.type === "set"){
    if(state.current){
      const as = state.current.activeSet;
      // "This Set" = the set you're working on; if you just ended a set and the
      // new one is still empty, stay on the last set that has data.
      sets = (as.rallies.length === 0 && state.current.sets.length > 0)
        ? [state.current.sets[state.current.sets.length - 1]]
        : [as];
    }
  } else if(scope.type === "match"){
    if(state.current) sets = [...state.current.sets, state.current.activeSet];
  } else if(scope.type === "season"){
    state.matches.forEach(m => sets.push(...m.sets));
    if(state.current) sets.push(...state.current.sets, state.current.activeSet);
  }
  return sets;
}
function computeTriangle(sets){
  let usAces=0, oppAces=0, usOwnErrors=0, oppOwnErrors=0;
  let usFbkYes=0, usFbkReceives=0, oppFbkYes=0, oppFbkReceives=0;
  let usRcvWins=0, usRcvTotal=0, oppRcvWins=0, oppRcvTotal=0;       // receiver-only "comeback" rate
  let usSharedWins=0, oppSharedWins=0, sharedTransTotal=0;          // combined Rally Wins, both directions, shared denominator

  sets.forEach(s => s.rallies.forEach(r => {
    const receiver = r.server === "us" ? "opp" : "us";
    if(r.serveResult === "ace"){
      if(r.server === "us") usAces++; else oppAces++;
    } else if(r.serveResult === "error"){
      if(r.server === "us") usOwnErrors++; else oppOwnErrors++;
    } else if(r.serveResult === "in"){
      if(receiver === "us"){ usFbkReceives++; if(r.fbk) usFbkYes++; }
      else { oppFbkReceives++; if(r.fbk) oppFbkYes++; }

      if(r.fbk === false){
        // Receiver-only comeback tracking (own denominator per team)
        if(receiver === "us"){ usRcvTotal++; if(r.rallyWinner==="us") usRcvWins++; }
        else { oppRcvTotal++; if(r.rallyWinner==="opp") oppRcvWins++; }

        // Combined Rally Wins: every FBK-No rally counted once, shared denominator
        sharedTransTotal++;
        if(r.rallyWinner==="us") usSharedWins++; else oppSharedWins++;
      }
    }
  }));

  const usTerminalFor = usAces + oppOwnErrors;
  const oppTerminalFor = oppAces + usOwnErrors;

  return {
    totalRallies: sets.reduce((a,s)=>a+s.rallies.length,0),
    us:{
      aces: usAces, ownErrors: usOwnErrors, terminalFor: usTerminalFor,
      fbkYes: usFbkYes, fbkReceives: usFbkReceives,
      transWins: usSharedWins, transTotal: sharedTransTotal,
      rcvWins: usRcvWins, rcvTotal: usRcvTotal
    },
    opp:{
      aces: oppAces, ownErrors: oppOwnErrors, terminalFor: oppTerminalFor,
      fbkYes: oppFbkYes, fbkReceives: oppFbkReceives,
      transWins: oppSharedWins, transTotal: sharedTransTotal,
      rcvWins: oppRcvWins, rcvTotal: oppRcvTotal
    }
  };
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : null; }
function fmtPct(n,d){ const p = pct(n,d); return p===null ? "—" : p+"%"; }
function formatDate(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return (d.getMonth()+1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(-2);
}

function el(tag, props={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

/* -------- History backup: export / import as a JSON file -------- */
function exportHistory(){
  const payload = {
    app: "point-detective",
    version: 1,
    exportedAt: new Date().toISOString(),
    data: {
      teamName: state.teamName || "",
      oppName: state.oppName || "",
      matches: state.matches || [],
      current: state.current || null
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const fname = "point-detective-history-" + new Date().toISOString().slice(0,10) + ".json";
  const file = new File([blob], fname, { type: "application/json" });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:"Point Detective history" }).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
}

function importHistory(file){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch(e){ alert("That file isn't valid Point Detective data."); return; }
    const d = (parsed && parsed.data) ? parsed.data : parsed;
    if(!d || !Array.isArray(d.matches)){
      alert("That file doesn't contain a Point Detective history.");
      return;
    }
    const have = new Set((state.matches || []).map(m => m.id));
    const toAdd = d.matches.filter(m => m && m.id != null && !have.has(m.id));
    const dupes = d.matches.length - toAdd.length;
    if(toAdd.length === 0){
      alert(dupes > 0
        ? "Those matches are already in your history — nothing to import."
        : "No matches found in that file.");
      return;
    }
    const lines = ["Add " + toAdd.length + " match" + (toAdd.length === 1 ? "" : "es") + " from this file?"];
    if(dupes > 0) lines.push(dupes + " already in your history " + (dupes === 1 ? "was" : "were") + " skipped.");
    if(!confirm(lines.join("\n"))) return;

    state.matches = (state.matches || []).concat(toAdd)
      .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    if(!state.teamName && d.teamName) state.teamName = d.teamName;
    if(!state.oppName && d.oppName) state.oppName = d.oppName;
    saveState();
    state.screen = "reports";
    window._reportScope = "season";
    seasonDeselected = new Set();
    render();
  };
  reader.onerror = () => alert("Couldn't read that file.");
  reader.readAsText(file);
}

    el("h1",{text:"New Match"}),
    el("p",{text:"Enter both team names to begin logging."})
  ]));

  const teamInput = el("input",{type:"text", id:"teamNameInput", placeholder:"Our Team Name", value: state.teamName||""});
  const oppInput = el("input",{type:"text", id:"oppNameInput", placeholder:"Opponent", value: state.oppName||""});

  wrap.appendChild(el("div",{},[el("div",{class:"field-label",text:"Our Team"}), teamInput]));
  wrap.appendChild(el("div",{},[el("div",{class:"field-label",text:"Opponent"}), oppInput]));

  const startBtn = el("button",{class:"btn btn-primary", text:"Start Match ▸"});
  startBtn.addEventListener("click", ()=>{
    const t = teamInput.value.trim() || "Our Team";
    const o = oppInput.value.trim() || "Opponent";
    // Never drop an in-progress match: archive it (if it has any data) before starting a new one.
    if(state.current){
      const c = state.current;
      if(c.activeSet && c.activeSet.rallies.length > 0) c.sets.push(c.activeSet);
      if(c.sets.length > 0){
        c.finishedAt = c.finishedAt || new Date().toISOString();
        state.matches.push(c);
      }
      state.current = null;
    }
    state.teamName = t; state.oppName = o;
    state.current = newMatch(t,o);
    state.screen = "match";
    saveState();
    render();
  });
  wrap.appendChild(startBtn);

  if(state.matches.length > 0){
    wrap.appendChild(el("button",{class:"btn btn-ghost", text:"View Season Reports", onClick:()=>{state.screen="reports"; render();}}));
  }

  const tools = el("div",{class:"setup-tools"});
  if(state.matches.length > 0 || state.current){
    tools.appendChild(el("button",{class:"link-btn", text:"Export history", onClick: exportHistory}));
    tools.appendChild(el("span",{class:"tools-sep", text:"·"}));
  }
  const fileInput = el("input",{type:"file", accept:"application/json,.json", style:"display:none"});
  fileInput.addEventListener("change", (e)=>{
    const f = e.target.files && e.target.files[0];
    if(f) importHistory(f);
    e.target.value = "";
  });
  tools.appendChild(el("button",{class:"link-btn", text:"Import history", onClick:()=> fileInput.click()}));
  tools.appendChild(fileInput);
  wrap.appendChild(tools);

  wrap.appendChild(el("div",{class:"setup-tools-note", text: syncText()}));
  return wrap;
}

function renderEditPanel(c, s, i){
  const r = s.rallies[i];
  const card = el("div",{class:"step-card"});

  if(i===0){
    card.appendChild(el("div",{class:"field-label", text:"Server"}));
    const grid = el("div",{class:"choice-grid"});
    grid.appendChild(el("button",{class:"choice-btn team-us"+(editDraft.server==="us"?" selected":""), text:c.teamName, onClick:()=>{editDraft.server="us"; editDraft.fbk=null; editDraft.rallyWinner=null; render();}}));
    grid.appendChild(el("button",{class:"choice-btn team-opp"+(editDraft.server==="opp"?" selected":""), text:c.oppName, onClick:()=>{editDraft.server="opp"; editDraft.fbk=null; editDraft.rallyWinner=null; render();}}));
    card.appendChild(grid);
  } else {
    card.appendChild(el("div",{class:"step-sub", text:"Server: "+(editDraft.server==="us"?c.teamName:c.oppName)+" (determined by the previous rally's winner)"}));
  }

  card.appendChild(el("div",{class:"field-label", text:"Serve Result"}));
  const resGrid = el("div",{class:"choice-grid"});
  resGrid.appendChild(el("button",{class:"choice-btn ace"+(editDraft.serveResult==="ace"?" selected":""), text:"Ace", onClick:()=>{editDraft.serveResult="ace"; editDraft.fbk=null; editDraft.rallyWinner=null; render();}}));
  resGrid.appendChild(el("button",{class:"choice-btn error"+(editDraft.serveResult==="error"?" selected":""), text:"Error", onClick:()=>{editDraft.serveResult="error"; editDraft.fbk=null; editDraft.rallyWinner=null; render();}}));
  card.appendChild(resGrid);
  card.appendChild(el("button",{class:"choice-btn in"+(editDraft.serveResult==="in"?" selected":""), style:"width:100%", text:"In Play", onClick:()=>{editDraft.serveResult="in"; render();}}));

  if(editDraft.serveResult === "in"){
    const receiverName = editDraft.server==="us" ? c.oppName : c.teamName;
    const serverName = editDraft.server==="us" ? c.teamName : c.oppName;
    card.appendChild(el("div",{class:"field-label", text:"Did "+receiverName+" get a First Ball Kill?"}));
    card.appendChild(el("div",{class:"fbk-hint", text:"Point won on their first attack — or "+serverName+" never got the ball back over."}));
    const fbkGrid = el("div",{class:"choice-grid"});
    fbkGrid.appendChild(el("button",{class:"choice-btn yes"+(editDraft.fbk===true?" selected":""), text:"Yes", onClick:()=>{editDraft.fbk=true; editDraft.rallyWinner=null; render();}}));
    fbkGrid.appendChild(el("button",{class:"choice-btn no"+(editDraft.fbk===false?" selected":""), text:"No", onClick:()=>{editDraft.fbk=false; render();}}));
    card.appendChild(fbkGrid);

    if(editDraft.fbk === false){
      card.appendChild(el("div",{class:"field-label", text:"Who won the rally?"}));
      const winGrid = el("div",{class:"choice-grid"});
      winGrid.appendChild(el("button",{class:"choice-btn team-us"+(editDraft.rallyWinner==="us"?" selected":""), text:c.teamName, onClick:()=>{editDraft.rallyWinner="us"; render();}}));
      winGrid.appendChild(el("button",{class:"choice-btn team-opp"+(editDraft.rallyWinner==="opp"?" selected":""), text:c.oppName, onClick:()=>{editDraft.rallyWinner="opp"; render();}}));
      card.appendChild(winGrid);
    }
  }

  const canSave = editDraft.serveResult && (editDraft.serveResult!=="in" || editDraft.fbk===true || (editDraft.fbk===false && editDraft.rallyWinner));

  const actionsRow = el("div",{class:"bottom-actions"});
  const saveBtn = el("button",{class:"btn btn-primary", text:"Save Changes"});
  if(canSave){ saveBtn.addEventListener("click", saveEdit); } else { saveBtn.setAttribute("disabled","disabled"); }
  actionsRow.appendChild(saveBtn);
  actionsRow.appendChild(el("button",{class:"btn btn-ghost", text:"Cancel", onClick:cancelEdit}));
  card.appendChild(actionsRow);
  card.appendChild(el("button",{class:"btn btn-secondary", text:"🗑 Delete This Rally", onClick:()=>deleteRally(i)}));

  return card;
}

function renderMatch(){
  const wrap = el("div",{class:"screen"});
  const c = state.current;
  const s = c.activeSet;

  // Scoreboard
  wrap.appendChild(el("div",{class:"scoreboard"},[
    el("div",{class:"score-team us"},[el("div",{class:"name",text:c.teamName}), el("div",{class:"score",text:s.scoreUs})]),
    el("div",{},[el("div",{class:"score-mid",text:"VS"}), el("div",{class:"set-pill", text:"SET "+s.setNumber})]),
    el("div",{class:"score-team opp"},[el("div",{class:"name",text:c.oppName}), el("div",{class:"score",text:s.scoreOpp})])
  ]));

  if(s.serving){
    wrap.appendChild(el("div",{class:"serving-indicator"},[
      el("span",{class:"dot"}),
      el("span",{text: (s.serving==="us"?c.teamName:c.oppName) + " serving"})
    ]));
  }

  if(editingIndex !== null && s.rallies[editingIndex]){
    wrap.appendChild(el("div",{class:"edit-banner", text:"Editing Rally #"+(editingIndex+1)}));
    wrap.appendChild(renderEditPanel(c, s, editingIndex));
  } else {
    const card = el("div",{class:"step-card"});

    if(!s.serving){
      // First rally of the set: confirm who serves
      card.appendChild(el("div",{class:"step-title", text:"Who serves first?"}));
      const grid = el("div",{class:"choice-grid"});
      grid.appendChild(el("button",{class:"choice-btn team-us", text:c.teamName, onClick:()=>{s.serving="us"; saveState(); render();}}));
      grid.appendChild(el("button",{class:"choice-btn team-opp", text:c.oppName, onClick:()=>{s.serving="opp"; saveState(); render();}}));
      card.appendChild(grid);
      card.appendChild(el("div",{class:"step-sub", text:"This will auto-advance after each rally."}));
    } else if(!s.pendingServeResult){
      // Step: Serve result
      card.appendChild(el("div",{class:"step-title", text:"Serve?"}));
      const grid = el("div",{class:"choice-grid"});
      grid.appendChild(el("button",{class:"choice-btn ace", onClick:()=>logServeResult("ace")},[
        el("span",{text:"Ace"})
      ]));
      grid.appendChild(el("button",{class:"choice-btn error", onClick:()=>logServeResult("error")},[
        el("span",{text:"Error"})
      ]));
      card.appendChild(grid);
      card.appendChild(el("button",{class:"choice-btn in", style:"width:100%", onClick:()=>logServeResult("in")},[
        el("span",{text:"In Play"})
      ]));
    } else if(s.pendingServeResult === "in" && s.pendingFbk === null){
      // Step: FBK?
      const receiverName = s.serving === "us" ? c.oppName : c.teamName;
      const serverName = s.serving === "us" ? c.teamName : c.oppName;
      card.appendChild(el("div",{class:"step-title", text:"Did "+receiverName+" get a First Ball Kill?"}));
      card.appendChild(el("div",{class:"step-sub", text:"They won the point on their first attack — or "+serverName+" never got the ball back over."}));
      const grid = el("div",{class:"choice-grid"});
      grid.appendChild(el("button",{class:"choice-btn yes", text:"Yes", onClick:()=>logFbk(true)}));
      grid.appendChild(el("button",{class:"choice-btn no", text:"No", onClick:()=>logFbk(false)}));
      card.appendChild(grid);
    } else {
      // Step: who won the rally (transition)
      card.appendChild(el("div",{class:"step-title", text:"Who won the rally?"}));
      const grid = el("div",{class:"choice-grid"});
      grid.appendChild(el("button",{class:"choice-btn team-us", text:c.teamName, onClick:()=>logRallyWinner("us")}));
      grid.appendChild(el("button",{class:"choice-btn team-opp", text:c.oppName, onClick:()=>logRallyWinner("opp")}));
      card.appendChild(grid);
    }

    wrap.appendChild(card);
  }

  if(editingIndex === null && (s.serving || s.rallies.length > 0)){
    wrap.appendChild(el("div",{class:"undo-row"},[
      el("button",{class:"undo-link", text:"↩ Undo last action", onClick:undoLastAction})
    ]));
  }

  if(s.rallies.length > 0){
    // Full rally list, most recent first, running score at time of each rally, tap to edit
    let runUs=0, runOpp=0;
    const withScores = s.rallies.map((r,idx)=>{
      if(r.rallyWinner==="us") runUs++; else runOpp++;
      return {...r, idx, scoreUs: runUs, scoreOpp: runOpp};
    });
    const ordered = withScores.slice().reverse();

    const log = el("div",{class:"rally-log"});
    log.appendChild(el("div",{class:"rally-log-title", text:"All Rallies · tap to edit"}));
    ordered.forEach(r=>{
      const serverName = r.server==="us" ? c.teamName : c.oppName;
      let what, whatClass;
      if(r.serveResult==="ace"){ what="Ace"; whatClass="ace"; }
      else if(r.serveResult==="error"){ what="Serve Error"; whatClass="error"; }
      else if(r.fbk){ what="FBK"; whatClass="fbk"; }
      else { what="Transition · " + (r.rallyWinner==="us"?c.teamName:c.oppName)+" won"; whatClass=""; }
      log.appendChild(el("div",{class:"rally-item", onClick:()=>startEdit(r.idx)},[
        el("span",{class:"who", text: "#"+(r.idx+1)+" "+serverName+" serving"}),
        el("span",{class:"what "+whatClass, text: what}),
        el("span",{class:"score-after", text: r.scoreUs+"–"+r.scoreOpp})
      ]));
    });
    wrap.appendChild(log);
  }

  if(editingIndex === null){
    wrap.appendChild(el("div",{class:"bottom-actions"},[
      el("button",{class:"btn btn-secondary", text:"End Set", onClick:endSet}),
      el("button",{class:"btn btn-ghost", text:"Finish Match", onClick:endMatch})
    ]));
    wrap.appendChild(el("div",{class:"actions-hint", text:"End Set starts the next set. Finish Match saves the whole match and closes it."}));
  }

  return wrap;
}

function zoneClass(p){
  if(p===null) return "";
  if(p>=48) return "zone-green";
  if(p>=44) return "zone-gold";
  if(p>=39) return "zone-orange";
  return "zone-red";
}
function netRow(label, net, usName, usVal, usDetail, oppName, oppVal, oppDetail){
  const netClass = net>0?"pos":net<0?"neg":"zero";
  const netText = net>0? "+"+net : String(net);
  return el("div",{class:"tri-net-row"},[
    el("div",{},[
      el("div",{class:"tri-net-label", text:label}),
      el("div",{class:"tri-net-value "+netClass, text:netText})
    ]),
    el("div",{class:"tri-net-detail"},[
      el("div",{class:"line"},[el("b",{class:"us",text:String(usVal)}), usName+" ", el("span",{class:"d",text:usDetail})]),
      el("div",{class:"line"},[el("b",{class:"opp",text:String(oppVal)}), oppName+" ", el("span",{class:"d",text:oppDetail})])
    ])
  ]);
}
function plainRow(label, usVal, usSub, oppVal, oppSub, usZone, oppZone){
  return el("div",{class:"tri-plain-row"},[
    el("span",{class:"m", text:label}),
    el("span",{class:"c "+(usZone||"")},[String(usVal), usSub?el("small",{text:usSub}):null]),
    el("span",{class:"c "+(oppZone||"")},[String(oppVal), oppSub?el("small",{text:oppSub}):null])
  ]);
}

function renderReports(){
  const wrap = el("div",{class:"screen"});
  wrap.appendChild(el("div",{class:"step-title", text:"Reports"}));

  if(!state.current && state.matches.length===0){
    wrap.appendChild(el("div",{class:"empty-state"},[
      el("div",{class:"glyph", text:"🔍"}),
      el("h3",{text:"No data yet"}),
      el("p",{text:"Start a match and log a few rallies — your Triangle stats will show up here."})
    ]));
    wrap.appendChild(el("button",{class:"btn btn-primary", text:"◂ Back", onClick:()=>{state.screen = state.current?"match":"setup"; render();}}));
    return wrap;
  }

  window._reportScope = window._reportScope || "set";
  const tabs = el("div",{class:"scope-tabs"});
  const scopes = [["set","This Set"],["match","This Match"],["season","Season"]];
  scopes.forEach(([key,label])=>{
    if(key!=="season" && !state.current) return;
    const btn = el("button",{text:label, class: window._reportScope===key ? "active":""});
    btn.addEventListener("click", ()=>{ window._reportScope = key; render(); });
    tabs.appendChild(btn);
  });
  wrap.appendChild(tabs);

  const sets = window._reportScope === "season"
    ? getAllHistoricalSets().filter(h=>!seasonDeselected.has(h.key)).map(h=>h.set)
    : allSetsInScope({type: window._reportScope});
  const tri = computeTriangle(sets);
  // Set/Match scope always has state.current. For Season without a live match,
  // name from the most recently created match — not matches[0] (arbitrary order).
  const latestMatch = (state.matches || []).slice()
    .sort((a,b)=> String(b && b.createdAt || "").localeCompare(String(a && a.createdAt || "")))[0];
  const nameSource = state.current || latestMatch || null;
  const teamName = nameSource ? nameSource.teamName : "Us";
  const oppName = nameSource ? nameSource.oppName : "Opponent";
  const scopeLabel = window._reportScope==="set" ? "Set " + (sets[0] ? sets[0].setNumber : 1)
    : window._reportScope==="match" ? "Match" : "Season";

  if(window._reportScope === "season"){
    const allHist = getAllHistoricalSets();
    if(allHist.length > 0){
      const picker = el("div",{class:"set-picker"});
      picker.appendChild(el("div",{class:"set-picker-title", text:"Filter by Set"}));
      const pills = el("div",{class:"set-pills"});
      const allActive = seasonDeselected.size === 0;
      const allBtn = el("button",{class:"set-pill all-pill"+(allActive?" active":""), text:"ALL"});
      allBtn.addEventListener("click", ()=>{ seasonDeselected = new Set(); render(); });
      pills.appendChild(allBtn);
      allHist.forEach(h=>{
        const active = !seasonDeselected.has(h.key);
        const pill = el("button",{class:"set-pill"+(active?" active":""), text:h.label});
        pill.addEventListener("click", ()=>{
          if(seasonDeselected.has(h.key)) seasonDeselected.delete(h.key); else seasonDeselected.add(h.key);
          render();
        });
        pills.appendChild(pill);
      });
      picker.appendChild(pills);
      wrap.appendChild(picker);
    }
  }

  if(tri.totalRallies === 0){
    wrap.appendChild(el("div",{class:"empty-state"},[
      el("div",{class:"glyph", text:"🏐"}),
      el("h3",{text:"Nothing logged in this scope yet"}),
      el("p",{text:"Try a different scope, or log a few rallies first."})
    ]));
  } else {
    const card = el("div",{class:"tri-card"});

    const matchDate = (window._reportScope !== "season" && state.current) ? formatDate(state.current.createdAt) : "";
    // Season sets can span multiple opponents — no single opponent name applies.
    const headerSub = window._reportScope === "season"
      ? teamName + " — Season"
      : teamName+" vs "+oppName+" — "+scopeLabel + (matchDate ? " · "+matchDate : "");

    // Score line for the Share Card: this set's points, each set's points, or the season total.
    let scoreSegs;
    if(window._reportScope === "set"){
      scoreSegs = sets[0] ? [[sets[0].scoreUs, sets[0].scoreOpp]] : [];
    } else if(window._reportScope === "match"){
      scoreSegs = sets.filter(st => (st.scoreUs + st.scoreOpp) > 0).map(st => [st.scoreUs, st.scoreOpp]);
    } else {
      let su = 0, so = 0; sets.forEach(st => { su += st.scoreUs; so += st.scoreOpp; });
      scoreSegs = (su + so) > 0 ? [[su, so]] : [];
    }
    card.appendChild(el("div",{class:"tri-header"},[
      el("h2",{text:"TRIANGLE REPORT"}),
      el("p",{text: headerSub})
    ]));
    card.appendChild(el("div",{class:"tri-colheader"},[
      el("span",{class:"m", text:"METRIC"}),
      el("span",{class:"c us", text:teamName.toUpperCase()}),
      el("span",{class:"c opp", text:oppName.toUpperCase()})
    ]));

    // TERMINAL SERVING
    const netTerm = tri.us.terminalFor - tri.opp.terminalFor;
    card.appendChild(el("div",{class:"tri-section", text:"TERMINAL SERVING"}));
    card.appendChild(netRow("NET TERMINAL", netTerm,
      teamName, tri.us.terminalFor, `${tri.us.aces} aces + ${tri.opp.ownErrors} opp errors`,
      oppName, tri.opp.terminalFor, `${tri.opp.aces} aces + ${tri.us.ownErrors} opp errors`));
    card.appendChild(plainRow("Own Aces", tri.us.aces, "", tri.opp.aces, ""));
    card.appendChild(plainRow("+ Opp Errors", tri.opp.ownErrors, "", tri.us.ownErrors, ""));
    card.appendChild(plainRow("= Total Terminal", tri.us.terminalFor, "", tri.opp.terminalFor, ""));

    // FIRST BALL KILL
    const netFbk = tri.us.fbkYes - tri.opp.fbkYes;
    const usFbkPct = pct(tri.us.fbkYes, tri.us.fbkReceives);
    const oppFbkPct = pct(tri.opp.fbkYes, tri.opp.fbkReceives);
    card.appendChild(el("div",{class:"tri-section", text:"FIRST BALL KILL"}));
    card.appendChild(netRow("NET FBK", netFbk,
      teamName, tri.us.fbkYes, `${tri.us.fbkYes} / ${tri.us.fbkReceives} receives`,
      oppName, tri.opp.fbkYes, `${tri.opp.fbkYes} / ${tri.opp.fbkReceives} receives`));
    card.appendChild(plainRow("FBK Kills",
      fmtPct(tri.us.fbkYes,tri.us.fbkReceives), `of ${tri.us.fbkReceives} receives`,
      fmtPct(tri.opp.fbkYes,tri.opp.fbkReceives), `of ${tri.opp.fbkReceives} receives`,
      zoneClass(usFbkPct), zoneClass(oppFbkPct)));

    card.appendChild(el("div",{class:"tri-legend-header"}, "FBK% ZONES"));
    card.appendChild(el("div",{class:"tri-legend"},[
      el("span",{},[el("span",{class:"sw green"}), "48%+ Championship"]),
      el("span",{},[el("span",{class:"sw gold"}), "44–47% Average"]),
      el("span",{},[el("span",{class:"sw orange"}), "39–43% Inconsistent"]),
      el("span",{},[el("span",{class:"sw red"}), "<39% Danger zone"])
    ]));

    // TRANSITION
    const netRally = tri.us.transWins - tri.opp.transWins;
    card.appendChild(el("div",{class:"tri-section", text:"TRANSITION · AFTER FBK NO"}));
    card.appendChild(netRow("NET RALLY WINS", netRally,
      teamName, tri.us.transWins, `${tri.us.transWins} / ${tri.us.transTotal} rallies`,
      oppName, tri.opp.transWins, `${tri.opp.transWins} / ${tri.opp.transTotal} rallies`));
    card.appendChild(plainRow("Rally Wins",
      tri.us.transWins, `of ${tri.us.transTotal} rallies`,
      tri.opp.transWins, `of ${tri.opp.transTotal} rallies`));
    card.appendChild(plainRow("Rcv Comeback",
      fmtPct(tri.us.rcvWins, tri.us.rcvTotal), `${tri.us.rcvWins}/${tri.us.rcvTotal} rcv`,
      fmtPct(tri.opp.rcvWins, tri.opp.rcvTotal), `${tri.opp.rcvWins}/${tri.opp.rcvTotal} rcv`));
    card.appendChild(el("div",{class:"tri-note"},[
      el("b",{text:"Rcv Comeback: "}),
      "how often a team wins the rally after receiving serve and failing to convert a First Ball Kill."
    ]));

    wrap.appendChild(card);
    wrap.appendChild(el("div",{class:"tri-scope-note", text: tri.totalRallies + " rallies in this scope"}));

    const shareBtn = el("button",{class:"btn btn-secondary", text:"🖼 Share Card"});
    shareBtn.addEventListener("click", ()=> saveShareCard(shareBtn, {
      teamName, oppName, scopeLabel, matchDate,
      scopeKey: window._reportScope, scoreSegs,
      netTerm, usTerminalFor: tri.us.terminalFor, oppTerminalFor: tri.opp.terminalFor,
      netFbk, usFbkPct, oppFbkPct,
      netRally, usTransWins: tri.us.transWins, oppTransWins: tri.opp.transWins
    }));
    wrap.appendChild(shareBtn);

    const snapBtn = el("button",{class:"btn btn-secondary", text:"📸 Save Snapshot"});
    snapBtn.addEventListener("click", ()=> saveTriangleSnapshot(snapBtn, card, teamName, oppName, scopeLabel));
    wrap.appendChild(snapBtn);
  }

  wrap.appendChild(el("button",{class:"btn btn-secondary", text:"◂ Back", onClick:()=>{state.screen = state.current?"match":"setup"; render();}}));
  return wrap;
}

/* -------- Condensed 1080x1350 branded Share Card -------- */
function saveShareCard(btn, o){
  if(btn._busy) return;
  if(typeof html2canvas === "undefined"){
    alert("The share tool hasn't loaded yet — check your connection and try again.");
    return;
  }
  btn._busy = true;
  const originalText = btn.textContent;
  btn.textContent = "Rendering…";
  btn.setAttribute("disabled","disabled");

  const US = "#6ea8e6", OPP = "#d0556c", GOLD = "#c9a24b", WHITE = "#f5f3ee", GREY = "#9fb0c7";
  const netColor = (n)=> n > 0 ? "#3f8f5f" : (n < 0 ? "#d0556c" : GREY);
  const netText = (n)=> n > 0 ? "+"+n : String(n);

  const holder = document.createElement("div");
  holder.style.cssText =
    "position:fixed;left:-20000px;top:0;width:1080px;height:1350px;box-sizing:border-box;overflow:hidden;"+
    "padding:72px 72px 56px;display:flex;flex-direction:column;align-items:center;text-align:center;"+
    "background:linear-gradient(180deg,#0f1e38,#0a1526);color:"+WHITE+";"+
    "font-family:Arial,Helvetica,sans-serif;";

  const add = (tag, css, text)=>{ const e=document.createElement(tag); if(css) e.style.cssText=css; if(text!=null) e.textContent=text; holder.appendChild(e); return e; };

  const logo = document.createElement("img");
  logo.src = LOGO_SRC; logo.crossOrigin = "anonymous";
  logo.style.cssText = "height:210px;width:auto;display:block;";
  holder.appendChild(logo);
  add("div","font-weight:800;font-size:34px;letter-spacing:.02em;margin-top:14px;","Point Detective");
  add("div","font-weight:600;font-size:15px;color:"+GOLD+";letter-spacing:.22em;text-transform:uppercase;margin-top:6px;","Find More Wins");

  add("div","font-weight:800;font-size:42px;line-height:1.15;margin-top:44px;",
    o.scopeKey === "season" ? o.teamName : (o.teamName + "  vs  " + o.oppName));
  add("div","font-size:22px;color:"+GREY+";margin-top:10px;", o.scopeLabel + (o.matchDate ? "  ·  " + o.matchDate : ""));

  if(o.scoreSegs && o.scoreSegs.length){
    const lbl = o.scopeKey === "season" ? "TOTAL POINTS" : (o.scopeKey === "match" ? "BY SET" : "SET SCORE");
    add("div","font-size:13px;font-weight:800;letter-spacing:.18em;color:"+GOLD+";margin-top:34px;", lbl);
    const sc = add("div","font-size:40px;font-weight:900;margin-top:8px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;");
    o.scoreSegs.forEach(([u,x])=>{
      const seg = document.createElement("span");
      seg.style.whiteSpace = "nowrap";
      const su = document.createElement("span"); su.style.color = US; su.textContent = u;
      const dash = document.createElement("span"); dash.style.cssText = "color:"+GREY+";margin:0 12px;"; dash.textContent = "–";
      const so = document.createElement("span"); so.style.color = OPP; so.textContent = x;
      seg.appendChild(su); seg.appendChild(dash); seg.appendChild(so);
      sc.appendChild(seg);
    });
  }

  const blocks = document.createElement("div");
  blocks.style.cssText = "width:100%;margin-top:46px;display:flex;flex-direction:column;gap:22px;";
  holder.appendChild(blocks);

  const teamSpan = (name, disp, color)=>{
    const s = document.createElement("span");
    s.style.whiteSpace = "nowrap";
    const nm = document.createElement("span");
    nm.textContent = name;
    const b = document.createElement("span");
    b.style.cssText = "color:"+color+";font-weight:800;margin-left:12px;";
    b.textContent = disp;
    s.appendChild(nm); s.appendChild(b);
    return s;
  };
  const statBlock = (label, net, usDisp, oppDisp)=>{
    const b = document.createElement("div");
    b.style.cssText = "background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);border-radius:22px;padding:26px 30px;";
    const l = document.createElement("div");
    l.style.cssText = "font-size:19px;font-weight:800;letter-spacing:.16em;color:"+GOLD+";text-transform:uppercase;";
    l.textContent = label;
    const n = document.createElement("div");
    n.style.cssText = "font-size:66px;font-weight:900;line-height:1.1;margin:6px 0 8px;color:"+netColor(net)+";";
    n.textContent = netText(net);
    const sub = document.createElement("div");
    sub.style.cssText = "font-size:24px;color:"+GREY+";";
    const sep = document.createElement("span");
    sep.style.cssText = "margin:0 16px;color:"+GREY+";";
    sep.textContent = "·";
    sub.appendChild(teamSpan(o.teamName, usDisp, US));
    sub.appendChild(sep);
    sub.appendChild(teamSpan(o.oppName, oppDisp, OPP));
    b.appendChild(l); b.appendChild(n); b.appendChild(sub);
    blocks.appendChild(b);
  };

  const fbk = (p)=> p == null ? "—" : p + "%";
  statBlock("Terminal", o.netTerm, o.usTerminalFor, o.oppTerminalFor);
  statBlock("FBK", o.netFbk, fbk(o.usFbkPct), fbk(o.oppFbkPct));
  statBlock("Rally Wins", o.netRally, o.usTransWins, o.oppTransWins);

  add("div","margin-top:auto;padding-top:30px;font-size:22px;font-weight:600;color:"+GREY+";","www.VBPointDetective.com");

  document.body.appendChild(holder);

  const cleanup = ()=>{ holder.remove(); btn.textContent = originalText; btn.removeAttribute("disabled"); btn._busy = false; };
  const safe = (v)=> String(v).trim().replace(/[^\w]+/g,"_").replace(/^_+|_+$/g,"") || "x";
  const matchup = o.scopeKey === "season" ? safe(o.teamName) : safe(o.teamName)+"-vs-"+safe(o.oppName);
  const fname = "point-detective-"+matchup+"-"+safe(o.scopeLabel)+"-card.png";
  const shareText = o.scopeKey === "season"
    ? o.teamName+" — Season"
    : o.teamName+" vs "+o.oppName+" — "+o.scopeLabel;

  const capture = ()=>{
    html2canvas(holder, { backgroundColor:"#0a1526", width:1080, height:1350, scale:1, useCORS:true, logging:false })
      .then((canvas)=> new Promise((res)=> canvas.toBlob((b)=>res(b), "image/png")))
      .then((blob)=>{
        if(!blob) throw new Error("no blob");
        const file = new File([blob], fname, { type:"image/png" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          return navigator.share({ files:[file], title:"Triangle Report", text: shareText }).catch(()=>{});
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=> URL.revokeObjectURL(url), 5000);
      })
      .catch((e)=>{ console.error("share card failed:", e); alert("Couldn't render the share card. Try again."); })
      .then(cleanup);
  };

  if(logo.complete && logo.naturalWidth) capture();
  else { logo.onload = capture; logo.onerror = capture; }
}

/* -------- Export the full Triangle Report as one branded PNG -------- */
function saveTriangleSnapshot(btn, card, teamName, oppName, scopeLabel){
  if(btn._busy) return;
  if(typeof html2canvas === "undefined"){
    alert("The snapshot tool hasn't loaded yet — check your connection and try again.");
    return;
  }
  btn._busy = true;
  const originalText = btn.textContent;
  btn.textContent = "Rendering…";
  btn.setAttribute("disabled","disabled");

  // Offscreen container: brand banner -> full report -> footer
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:520px;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";

  const brand = document.createElement("div");
  brand.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px;padding:22px 0 16px;background:#0a1526;";
  const logo = document.createElement("img");
  logo.src = LOGO_SRC;
  logo.crossOrigin = "anonymous";
  logo.style.cssText = "height:96px;width:auto;display:block;";
  const bt = document.createElement("div");
  bt.style.cssText = "font-weight:800;font-size:14px;color:#f5f3ee;letter-spacing:.02em;";
  bt.textContent = "Point Detective";
  const bs = document.createElement("div");
  bs.style.cssText = "font-weight:500;font-size:10px;color:#c9a24b;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;";
  bs.textContent = "Find More Wins";
  brand.appendChild(logo); brand.appendChild(bt); brand.appendChild(bs);

  const cardClone = card.cloneNode(true);
  cardClone.style.margin = "0";
  cardClone.style.boxShadow = "none";
  cardClone.style.borderRadius = "0";

  const foot = document.createElement("div");
  foot.style.cssText = "text-align:center;font-size:11px;color:#8a94a6;font-weight:600;padding:14px 0 18px;background:#ffffff;";
  foot.textContent = "www.VBPointDetective.com";

  holder.appendChild(brand);
  holder.appendChild(cardClone);
  holder.appendChild(foot);
  document.body.appendChild(holder);

  const cleanup = ()=>{
    holder.remove();
    btn.textContent = originalText;
    btn.removeAttribute("disabled");
    btn._busy = false;
  };

  const safe = (v)=> String(v).trim().replace(/[^\w]+/g,"_").replace(/^_+|_+$/g,"") || "x";
  const fname = "point-detective-"+safe(teamName)+"-vs-"+safe(oppName)+"-"+safe(scopeLabel)+".png";

  const capture = ()=>{
    html2canvas(holder, { backgroundColor:"#ffffff", scale:2, useCORS:true, logging:false })
      .then((canvas)=> new Promise((res)=> canvas.toBlob((b)=>res(b), "image/png")))
      .then((blob)=>{
        if(!blob) throw new Error("no blob");
        const file = new File([blob], fname, { type:"image/png" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          return navigator.share({ files:[file], title:"Triangle Report",
            text: teamName+" vs "+oppName+" — "+scopeLabel }).catch(()=>{});
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=> URL.revokeObjectURL(url), 5000);
      })
      .catch((e)=>{ console.error("snapshot failed:", e); alert("Couldn't render the snapshot. Try again."); })
      .then(cleanup);
  };

  if(logo.complete && logo.naturalWidth) capture();
  else { logo.onload = capture; logo.onerror = capture; }
}

/* -------- Auth / Paywall / Account -------- */
let authPass = "";

function authFriendlyError(e){
  const c = (e && e.code) || "";
  const map = {
    "auth/invalid-email": "That doesn't look like a valid email address.",
    "auth/user-disabled": "This account has been disabled.",
    "auth/user-not-found": "No account found for that email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/email-already-in-use": "An account already exists for that email — try logging in.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a minute, then try again.",
    "auth/network-request-failed": "Network error. Check your connection.",
    "auth/account-exists-with-different-credential": "You already have an account with this email. Log in with your email and password.",
    "auth/unauthorized-domain": "This site isn't authorized for Google sign-in yet.",
    "auth/popup-blocked": "Your browser blocked the sign-in popup. Allow popups and try again."
  };
  return map[c] || (e && e.message) || "Something went wrong. Try again.";
}

async function doAuth(email, pass){
  if(authBusy) return;
  if(!email || !pass){ authError = "Enter your email and password."; render(); return; }
  authBusy = true; authError = ""; render();
  try{
    if(authMode === "login") await auth.signInWithEmailAndPassword(email, pass);
    else await auth.createUserWithEmailAndPassword(email, pass);
    // onAuthStateChanged takes it from here
  }catch(e){
    authError = authFriendlyError(e);
  }finally{
    authBusy = false;
    render();
  }
}

async function doReset(email){
  if(!email){ authError = "Type your email above first, then tap “Forgot password?”."; render(); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    alert("Password reset email sent to " + email + ". Check your inbox (and spam).");
  }catch(e){
    authError = authFriendlyError(e); render();
  }
}

function doLogout(){ if(auth) auth.signOut(); }

function doGoogle(){
  if(authBusy) return;
  authBusy = true; authError = ""; render();
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  auth.signInWithPopup(provider).catch(function(e){
    const c = e && e.code;
    if(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request"){
      // user dismissed the popup — no error message
    } else if(c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment"){
      auth.signInWithRedirect(provider).catch(function(err){ authError = authFriendlyError(err); authBusy = false; render(); });
      return;
    } else {
      authError = authFriendlyError(e);
    }
    authBusy = false;
    render();
  });
}

let lsCheckoutSucceeded = false;

function initLemonSqueezy(tries){
  tries = tries || 0;
  if(window.LemonSqueezy && window.LemonSqueezy.Setup){
    try{
      window.LemonSqueezy.Setup({
        eventHandler: function(payload){
          const ev = payload && payload.event;
          if(ev && (/success/i.test(ev) || /purchase/i.test(ev))){
            lsCheckoutSucceeded = true;
            render();  // Firestore listener will flip the gate once the webhook lands
          }
        }
      });
    }catch(e){ console.warn("LemonSqueezy.Setup failed:", e); }
  } else if(tries < 40){
    setTimeout(function(){ initLemonSqueezy(tries + 1); }, 250);
  }
}
initLemonSqueezy();

function startCheckout(){
  if(!LS_READY || !authUser) return;
  // checkout[custom][uid] is echoed back by the webhook as meta.custom_data.uid.
  const q = [
    "checkout[email]=" + encodeURIComponent(authUser.email),
    "checkout[custom][uid]=" + encodeURIComponent(authUser.uid)
  ].join("&");
  const sep = LS_CHECKOUT_URL.indexOf("?") === -1 ? "?" : "&";
  const url = LS_CHECKOUT_URL + sep + q;
  if(window.LemonSqueezy && window.LemonSqueezy.Url && window.LemonSqueezy.Url.Open){
    window.LemonSqueezy.Url.Open(url);   // in-app overlay; lemon.js appends embed=1
  } else {
    window.location.href = url;          // fallback: full-page checkout
  }
}

function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
  catch(e){ return String(iso); }
}

function renderSplash(msg){
  const wrap = el("div",{class:"splash"});
  wrap.appendChild(el("img",{src:LOGO_SRC, alt:"Point Detective", onerror:(e)=>{e.target.style.display='none';}}));
  wrap.appendChild(el("div",{class:"spin"}));
  if(msg) wrap.appendChild(el("p",{text:msg}));
  return wrap;
}

function renderAuth(){
  const wrap = el("div",{class:"screen"});
  wrap.appendChild(el("div",{class:"setup-hero"},[
    el("img",{src:LOGO_SRC, alt:"Point Detective", onerror:(e)=>{e.target.style.display='none';}}),
    el("h1",{text: authMode==="login" ? "Welcome back" : "Create your account"}),
    el("p",{text:"Point Detective is a subscription app. Sign in to continue."})
  ]));

  const tabs = el("div",{class:"auth-tabs"});
  tabs.appendChild(el("button",{class: authMode==="login"?"active":"", text:"Log In",
    onClick:()=>{ authMode="login"; authError=""; render(); }}));
  tabs.appendChild(el("button",{class: authMode==="signup"?"active":"", text:"Sign Up",
    onClick:()=>{ authMode="signup"; authError=""; render(); }}));
  wrap.appendChild(tabs);

  if(authError) wrap.appendChild(el("div",{class:"auth-error", text: authError}));

  const gicon = el("span",{class:"gicon"});
  gicon.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' +
    '<path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>' +
    '<path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>' +
    '<path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>' +
    '<path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>';
  const gbtn = el("button",{class:"btn btn-google"},[gicon, authMode==="login" ? "Continue with Google" : "Sign up with Google"]);
  if(authBusy) gbtn.setAttribute("disabled","disabled");
  gbtn.addEventListener("click", doGoogle);
  wrap.appendChild(gbtn);
  wrap.appendChild(el("div",{class:"or-divider"},[el("span",{text:"or"})]));

  const emailIn = el("input",{type:"text", placeholder:"you@example.com", value: authEmail, autocomplete:"email", autocapitalize:"none", spellcheck:"false"});
  emailIn.addEventListener("input", ()=>{ authEmail = emailIn.value; });
  const passIn = el("input",{type:"password", placeholder:"Password", value: authPass, autocomplete: authMode==="login"?"current-password":"new-password"});
  passIn.addEventListener("input", ()=>{ authPass = passIn.value; });
  passIn.addEventListener("keydown",(e)=>{ if(e.key==="Enter") doAuth(emailIn.value.trim(), passIn.value); });

  wrap.appendChild(el("div",{},[el("div",{class:"field-label",text:"Email"}), emailIn]));
  wrap.appendChild(el("div",{},[el("div",{class:"field-label",text:"Password"}), passIn]));

  const submit = el("button",{class:"btn btn-primary", text: authBusy ? "Please wait…" : (authMode==="login"?"Log In ▸":"Create Account ▸")});
  if(authBusy) submit.setAttribute("disabled","disabled");
  submit.addEventListener("click", ()=> doAuth(emailIn.value.trim(), passIn.value));
  wrap.appendChild(submit);

  if(authMode==="login"){
    wrap.appendChild(el("div",{class:"undo-row"},[
      el("button",{class:"link-btn", text:"Forgot password?", onClick:()=> doReset(emailIn.value.trim())})
    ]));
  }
  wrap.appendChild(el("div",{class:"auth-note", text:"Your match logs live on this device. Your account controls subscription access only."}));
  return wrap;
}

function renderPaywall(){
  const wrap = el("div",{class:"screen"});
  const returned = lsCheckoutSucceeded || new URLSearchParams(location.search).has("checkout");
  const pending = returned && subLoaded && !hasAccess();

  const card = el("div",{class:"paywall"});
  card.appendChild(el("h2",{text: pending ? "Almost there…" : "Start your free trial"}));

  if(pending){
    card.appendChild(el("div",{class:"confirm-box", text:"We're confirming your subscription with the payment processor. This usually takes only a few seconds — this screen updates on its own."}));
    card.appendChild(el("button",{class:"btn btn-secondary", text:"Check again", onClick:()=>render()}));
  } else {
    if(LS_PRICE_LABEL) card.appendChild(el("div",{class:"price", text: LS_PRICE_LABEL}));
    card.appendChild(el("ul",{},[
      el("li",{text:"Log every rally: serve, first ball kill, transition"}),
      el("li",{text:"Triangle Report by set, match, and season"}),
      el("li",{text:"Tap any rally to fix it — the score recalculates"})
    ]));
    const go = el("button",{class:"btn btn-primary", text: LS_READY ? "Start Free Trial ▸" : "Checkout not set up yet"});
    if(LS_READY) go.addEventListener("click", startCheckout); else go.setAttribute("disabled","disabled");
    card.appendChild(go);
  }

  if(subDoc && subDoc.customer_portal_url){
    card.appendChild(el("button",{class:"btn btn-secondary", text:"Manage / restore subscription",
      onClick:()=>{ window.location.href = subDoc.customer_portal_url; }}));
  }
  if(subDoc && subDoc.status){
    card.appendChild(el("div",{class:"auth-note", text:"Current status: " + (subDoc.status_formatted || subDoc.status)}));
  }

  wrap.appendChild(card);
  wrap.appendChild(el("button",{class:"btn btn-ghost", text:"Log Out", onClick: doLogout}));
  return wrap;
}

function renderAccount(){
  const wrap = el("div",{class:"screen"});
  wrap.appendChild(el("div",{class:"step-title", text:"Account"}));

  const card = el("div",{class:"acct-card"});
  const row = (k,v)=> el("div",{class:"acct-row"},[el("span",{class:"k",text:k}), el("span",{class:"v",text:v})]);
  card.appendChild(row("Email", authUser.email || "—"));
  card.appendChild(row("Subscription", subDoc ? (subDoc.status_formatted || subDoc.status) : "No subscription"));
  if(subDoc && subDoc.status === "on_trial" && subDoc.trial_ends_at) card.appendChild(row("Trial ends", fmtDate(subDoc.trial_ends_at)));
  if(subDoc && (subDoc.status === "active" || subDoc.status === "on_trial") && subDoc.renews_at) card.appendChild(row("Renews", fmtDate(subDoc.renews_at)));
  if(subDoc && subDoc.status === "cancelled" && subDoc.ends_at) card.appendChild(row("Access until", fmtDate(subDoc.ends_at)));
  if(subDoc && (subDoc.card_brand || subDoc.card_last_four)) card.appendChild(row("Card", (subDoc.card_brand||"card") + " ···· " + (subDoc.card_last_four||"")));
  const matchCount = (state.matches ? state.matches.length : 0) + (state.current ? 1 : 0);
  card.appendChild(row("Match history", matchCount + (matchCount === 1 ? " match" : " matches")));
  card.appendChild(row("Backup", syncStatus === "synced" ? "Backed up to your account"
    : syncStatus === "offline" ? "Offline — will sync"
    : syncStatus === "pending" ? "Saving…" : "Syncing…"));
  wrap.appendChild(card);

  wrap.appendChild(el("button",{class:"btn btn-secondary", text:"↻ Sync now",
    onClick:()=>{ syncStatus = "syncing"; render(); cloudPushNow(); }}));

  if(subDoc && subDoc.customer_portal_url){
    wrap.appendChild(el("button",{class:"btn btn-primary", text:"Manage Subscription & Billing",
      onClick:()=>{ window.location.href = subDoc.customer_portal_url; }}));
  }
  wrap.appendChild(el("button",{class:"btn btn-secondary", text:"◂ Back to App", onClick:()=>{ uiScreen=null; render(); }}));
  wrap.appendChild(el("button",{class:"btn btn-ghost", text:"Log Out", onClick: doLogout}));
  return wrap;
}

function render(){
  root.innerHTML = "";

  if(FIREBASE_READY && !authResolved){ root.appendChild(renderSplash()); return; }

  if(FIREBASE_READY && !authUser){
    root.appendChild(renderAuth());
    return;
  }

  if(FIREBASE_READY && !subLoaded){ root.appendChild(renderSplash("Loading your account…")); return; }

  if(FIREBASE_READY && uiScreen === "account"){
    root.appendChild(topbar(false));
    root.appendChild(renderAccount());
    return;
  }

  if(FIREBASE_READY && !hasAccess()){
    root.appendChild(topbar(false));
    root.appendChild(renderPaywall());
    return;
  }

  root.appendChild(topbar(state.screen !== "reports"));
  if(state.screen === "setup") root.appendChild(renderSetup());
  else if(state.screen === "match") root.appendChild(renderMatch());
  else if(state.screen === "reports") root.appendChild(renderReports());
}

render();
</script>
